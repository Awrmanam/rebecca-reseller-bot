[project]
name = "rebecca-reseller-bot"
version = "0.1.0"
description = "Safety-first Telegram reseller manager for Rebecca Panel"
requires-python = ">=3.12"
dependencies = ["aiogram>=3.13,<4", "SQLAlchemy[asyncio]>=2.0,<3", "aiosqlite>=0.20", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30", "pydantic-settings>=2.5", "apscheduler>=3.10,<4"]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
